# Round 4: the LitSearch corpus as a local, deterministic source. Rounds 1-3 searched
# the open literature, where the outcome depended on which services answered (round 3:
# keyless Semantic Scholar failed 211 of 212 searches, arXiv answered 429 for most
# repeat probes), so no arm could be separated from the weather. Here every arm searches
# one fixed corpus, the 64,183 papers of LitSearch (dataset revision 9573fb28...), by
# BM25 over title and abstract; a gold paper is the corpus record with the query's
# corpus id. The only things that vary between runs are the language model's planning
# and query writing and the decision model's answers.
#   bm25-question  reference, no model: BM25 over the corpus with the raw question
#   v2-baseline    preset baseline
#   v2-recall      preset recall (screening queue by source rank)
#   v2-fast        preset fast (lexical pre-filter, claim support checked in code first)
# Rules, thresholds and wording were fixed before any run; a change is a new file.
#
# Not frozen: the searches are local and deterministic, so there is nothing to
# snapshot. Each arm plans and writes its own queries live (temperature 0, seed 42, but
# the cloud model does not answer identically twice: round 2 measured this), which is
# part of what an arm is and is stated here, not hidden.
#
# Run: the round-4 section of src/andamentum/deep_research/v2/CLAUDE.md. Keyless: no API
# key is read or used. Needs the litsearch-local download (data/benchmarks/litsearch).
name: round4
registered: "2026-10-07"
description: >-
  Recall of the recall preset against the baseline, and of the fast preset against
  the baseline, on 80 fresh LitSearch queries searched against the LitSearch corpus
  itself (local BM25, no network), with plain BM25 over the raw question as the
  reference.
repeats: 1
keyless: true

set_sources:
  litsearch-local:
    scholarly: [local_corpus]
    expand_with: [local_corpus]
    results_per_query: 20

sets:
  - {name: litsearch-local, n: 80, skip: 60, seed: 0}   # positions 61-140: unseen by rounds 1-3

arms:
  - name: bm25-question
    system: bm25
    top_k: 100
  - name: v2-baseline
    system: v2
    preset: baseline
    frozen: false
    model: "ollama:gemma4:31b-cloud"
    decision_model: "nimble:9b"
  - name: v2-recall
    system: v2
    preset: recall
    frozen: false
    model: "ollama:gemma4:31b-cloud"
    decision_model: "nimble:9b"
  - name: v2-fast
    system: v2
    preset: fast
    frozen: false
    model: "ollama:gemma4:31b-cloud"
    decision_model: "nimble:9b"

baselines:
  litsearch-local: v2-baseline

rules:
  - id: P1-recall-at-20
    group: P1
    question: "recall@20 of v2-recall is above v2-baseline (paired, the whole 95% interval above 0)"
    set: litsearch-local
    metric: recall_at_20
    arm: v2-recall
    reference: v2-baseline
    test: superior
    margin: 0
  - id: P2-baseline-against-bm25
    group: P2
    question: "recall@20 of v2-baseline against plain BM25 over the raw question (paired; reported: does the language-model pipeline beat plain BM25?)"
    set: litsearch-local
    metric: recall_at_20
    arm: v2-baseline
    reference: bm25-question
    test: superior
    margin: 0
    gate: false
  - id: P3-fast-not-worse
    group: P3
    question: "recall@20 of v2-fast is not worse than v2-baseline by more than 0.05 (paired, the whole 95% interval above -0.05)"
    set: litsearch-local
    metric: recall_at_20
    arm: v2-fast
    reference: v2-baseline
    test: noninferior
    margin: 0.05

decisions:
  - id: recall-preset
    requires: [P1]
    if_accepted: "On a fixed local corpus the recall preset (queue by source rank) finds more gold papers in the top 20 than the baseline: the preset is worth keeping as the recall configuration."
    otherwise: "The recall preset's queue order does not beat the baseline on this corpus with an interval excluding 0: no evidence for it from a setting free of source outages."
  - id: fast-preset
    requires: [P3]
    if_accepted: "The fast preset does not lose recall@20 by more than 0.05 against the baseline on this corpus."
    otherwise: "The fast preset's pre-filter loses recall (or the interval cannot exclude a loss above 0.05): it is not a free speed-up for recall."

notes:
  - >-
    Items: LitSearch positions 61-140 of the seed-0 order (litsearch-local {n: 80,
    skip: 60, seed: 0}; an item whose gold ids are all missing from the corpus drops
    out and is counted by the report). Excluded, every query used in rounds 1-3 for a
    run or the diagnosis, which are positions 1-60 of the same order (round 1: the first
    30; round 2: 28 of them, used to diagnose the losses; round 3: positions 29-60):
    LS0513 LS0042 LS0381 LS0490 LS0331 LS0144 LS0407 LS0569 LS0460 LS0260 LS0047 LS0530
    LS0124 LS0074 LS0501 LS0040 LS0056 LS0369 LS0498 LS0135 LS0088 LS0503 LS0548 LS0027
    LS0052 LS0099 LS0184 LS0172 LS0345 LS0400 LS0504 LS0362 LS0377 LS0560 LS0274 LS0079
    LS0325 LS0063 LS0223 LS0132 LS0153 LS0430 LS0363 LS0418 LS0057 LS0249 LS0468 LS0007
    LS0333 LS0261 LS0005 LS0428 LS0542 LS0201 LS0287 LS0143 LS0535 LS0315 LS0525 LS0206.
  - >-
    The corpus and the ranking. Every arm reads the same local corpus (the
    corpus_clean configuration of princeton-nlp/LitSearch at revision
    9573fb284a1026c998df47024b888a163f0f0e25: 64,183 papers, title, abstract and the
    citation ids that fall inside the corpus). The ranking is SQLite FTS5 BM25 over
    title and abstract as one text, tokens stemmed (porter unicode61), the query's words
    joined by OR, ties broken by corpus order. bm25-question runs it once with the raw
    question and keeps the first 100 records (top_k 100); the v2 arms ask it for 20
    records per query (results_per_query 20) and read each record's title and abstract
    as its text (access abstract), with its in-corpus references and citations for
    citation expansion.
  - >-
    Not frozen. The searches are deterministic, so no snapshot is taken; each v2 arm
    plans its own sub-questions and writes its own queries with the language model, and
    the screening answers come from the decision model. Both vary between runs, so one
    repeat per arm measures one draw, and the paired interval over the 80 items is what
    carries the uncertainty. The arms run live, one after another, up to four cells at a
    time (the language model is an Ollama cloud model); decision-model requests are
    serialised. No shared decision cache is used, so each arm's cost is its own.
  - >-
    Gold. A gold paper is the corpus record with the query's corpus id (identifier
    local:<corpus id>); recall@k is the share of a query's gold records among the first
    k works of an arm's ranked result (matched by that id, else by an equal title). For
    the v2 arms the result is the cited works, then the other kept works by score
    (unchanged from rounds 1-3).
  - >-
    The loss table places each gold paper of each run, per arm: hit (kept and ranked 20
    or better), (c) kept but ranked below 20, (b) screened and dropped, (b') in the
    pool and never screened, (a) not in the pool (never retrieved). For bm25-question,
    which screens nothing, a gold paper is hit, (c) (in its top 100, below 20) or (a)
    (outside its top 100). The report also gives cost per arm: wall seconds, language
    model calls and tokens, decision answers.
  - >-
    P2 is reported, not a gate (gate false): whether the pipeline beats plain BM25 over
    the raw question is a finding, not a condition of the other rules. The corpus
    records are third-party data held for local evaluation only: the registry and
    reports computed from them stay in the data folder and are never committed.
