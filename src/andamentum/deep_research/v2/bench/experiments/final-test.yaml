# Final test: the legacy pipeline (v1) against the new research loop, each run as a
# user runs it. Decides whether the new engine replaces v1. Rules, margins and wording
# were fixed before any run; a change is a new file. Run it once, after final-dev.yaml.
#   legacy      run_research: web search through a Chrome over CDP, its own defaults
#   new-engine  research(): web mode for SimpleQA, scholarly mode (OpenAlex, Europe
#               PMC, arXiv) for LitSearch, the plan / search / choose / read / notes /
#               reflect loop, up to 3 rounds, one write
# Sets:
#   simpleqa       60 SimpleQA questions (seed 1, positions 4-63; 1-3 were smoke runs,
#                  64-83 are the dev set), each answer graded correct / incorrect / not
#                  attempted against the gold answer by gpt-oss:120b-cloud, a model
#                  neither arm uses
#   litsearch-web  17 LitSearch queries (seed 0, positions 151-167) searched live; a
#                  gold paper is matched by title
# The cells run item by item (legacy, then new-engine, on the same item), one at a time
# (concurrency 1), so both arms meet the same state of the search services and every
# wall time is clean.
# Run (DATA the litsearch-local download, SQA the folder of simple_qa_test_set.csv,
# OUT a folder under data/):
#   B="uv run python -m andamentum.deep_research.v2.bench"
#   $B experiment run src/andamentum/deep_research/v2/bench/experiments/final-test.yaml \
#     --out-dir $OUT --litsearch-local-dir $DATA --simpleqa-dir $SQA \
#     --browser-cdp-url http://127.0.0.1:9222 --concurrency 1
#   (a Chrome started with --remote-debugging-port=9222 and its own --user-data-dir)
#   $B experiment report src/andamentum/deep_research/v2/bench/experiments/final-test.yaml \
#     --out-dir $OUT
#   $B experiment losses src/andamentum/deep_research/v2/bench/experiments/final-test.yaml \
#     --out-dir $OUT --simpleqa-dir $SQA --litsearch-local-dir $DATA
# A search outage stops the run without recording the cell; the same command resumes.
name: final-test
registered: "2026-10-08"
description: >-
  The new research loop against v1 (legacy): SimpleQA answer correctness, LitSearch
  recall@20 searched live, and wall time per question, on the same items, cell by cell.
repeats: 1
grader: "ollama:gpt-oss:120b-cloud"

sets:
  - {name: simpleqa, n: 60, skip: 3, seed: 1}
  - {name: litsearch-web, n: 17, skip: 150, seed: 0}

arms:
  - name: legacy
    system: legacy
    model: "ollama:gemma4:31b-cloud"
  - name: new-engine
    system: v2
    model: "ollama:gemma4:31b-cloud"

baselines:
  simpleqa: legacy
  litsearch-web: legacy

rules:
  - id: Q1-simpleqa-correct
    group: Q
    question: "SimpleQA correctness of new-engine is not worse than legacy by more than 0.05 (paired)"
    set: simpleqa
    metric: correct
    arm: new-engine
    reference: legacy
    test: noninferior
    margin: 0.05
  - id: Q2-litsearch-recall-at-20
    group: Q
    question: "LitSearch recall@20 of new-engine is not worse than legacy by more than 0.05 (paired)"
    set: litsearch-web
    metric: recall_at_20
    arm: new-engine
    reference: legacy
    test: noninferior
    margin: 0.05
  - id: S1-simpleqa-wall
    group: S
    question: "wall seconds per SimpleQA question of new-engine are not above legacy's by more than 15 s (paired)"
    set: simpleqa
    metric: wall_s
    arm: new-engine
    reference: legacy
    test: noninferior
    margin: 15
    higher_is_better: false
  - id: S2-litsearch-wall
    question: "wall seconds per LitSearch query of new-engine against legacy (paired; reported)"
    set: litsearch-web
    metric: wall_s
    arm: new-engine
    reference: legacy
    test: noninferior
    margin: 15
    higher_is_better: false
    gate: false
  - id: B1-simpleqa-better
    question: "SimpleQA correctness of new-engine above legacy (paired; reported)"
    set: simpleqa
    metric: correct
    arm: new-engine
    reference: legacy
    test: superior
    gate: false
  - id: B2-litsearch-better
    question: "LitSearch recall@20 of new-engine above legacy (paired; reported)"
    set: litsearch-web
    metric: recall_at_20
    arm: new-engine
    reference: legacy
    test: superior
    gate: false

decisions:
  - id: D1-replace
    requires: [Q, S]
    if_accepted: >-
      The new engine replaces v1: it is not worse on either set and not slower; v1 is
      removed (no legacy code is kept) once its other users are moved to the new engine.
    otherwise: >-
      The new engine does not replace v1 as it stands: the groups not accepted say
      where it falls short (Q: results, S: speed).

notes:
  - >-
    Each system runs as a user runs it: v1 searches the web only (it has no scholarly
    sources), the new engine searches the web for SimpleQA and the scholarly sources
    for LitSearch. So the LitSearch rule compares the two tools, not the two engines on
    the same sources. The earlier v2 hybrid preset reached recall@20 0.176 on 17
    LitSearch queries; the new engine's value is reported against it.
  - >-
    Both arms search the web through one Chrome (DuckDuckGo's HTML page, Bing when
    DuckDuckGo shows a bot check), not SearxNG, and both read a fetched PDF from its
    text layer. The run is at concurrency 1.
  - >-
    The legacy pipeline counts no tokens or model calls, so cost is compared by wall
    time only. The wall time of the LitSearch set is reported (S2), not a gate.
  - >-
    OpenAlex is asked without a key unless one is in the environment; its keyless
    daily budget resets at 08:00 local time. A refused search (HTTP 429) stops the
    run without recording the cell, and the same command resumes after the reset.
