# Round 1: is the v2 baseline (one generic decision-model question per
# candidate, BM25 passages, no compiled criteria) good enough to replace the
# legacy pipeline, and is it repeatable? The rules below were fixed before any
# run. The `criteria` preset (LLM-written screening criteria) is NOT part of
# this round: it comes later as a variant that must beat this baseline on the
# same inputs, under a rule registered in its own file.
#
# Run:
#   bench freeze litsearch --dir DATA --snapshots SNAP --model M --decision-model D
#   bench freeze web       --snapshots SNAP --model M --decision-model D --searxng-url URL
#   bench experiment run   round1.yaml --out-dir OUT --snapshots SNAP --litsearch-dir DATA \
#       --synergy-dir DATA --searxng-url URL
#   bench experiment report round1.yaml --out-dir OUT
name: round1
registered: "2026-10-06"
description: >-
  v2-baseline against the legacy pipeline, repeat stability of v2-baseline on
  frozen inputs and end to end, a planted false source, and the screening
  sub-experiment (generic question answered by a decision model against the
  same question answered by the language model).
repeats: 3   # frozen arms: three repeats of every item

# Who judges claim support (the Q1 trust metrics). A deterministic local
# decision model, so the judge itself is repeatable. It is the same model the
# arms use to screen, so it is not independent of them: stated in the report.
judge:
  decision_model: "nimble:9b"

sets:
  - {name: litsearch, n: 30, seed: 0}      # LitSearch, seeded subset of queries
  - {name: web, n: 15, seed: 0}            # the 15 web questions
  - {name: web_planted, n: 15, seed: 0}    # the same 15, each with one planted false page
  - name: synergy                          # SYNERGY screening, 8 reviews x 150 records
    seed: 0
    records: 150
    reviews:
      - Donners_2021
      - Sep_2021
      - Meijboom_2021
      - Menon_2022
      - Hall_2012
      - Nelson_2002
      - Radjenovic_2013
      - Wassenaar_2017

arms:
  - name: legacy
    system: legacy               # live: run_research cannot take frozen inputs
    model: "ollama:gemma4:31b-cloud"
    decision_model: "nimble:9b"
    repeats: 1
    sets: [litsearch, web]
  - name: v2-baseline
    system: v2
    preset: baseline
    frozen: true                 # Plan and Search from the snapshot, three repeats
    model: "ollama:gemma4:31b-cloud"
    decision_model: "nimble:9b"
    sets: [litsearch, web, web_planted]
  - name: v2-baseline-live
    system: v2
    preset: baseline
    frozen: false                # end-to-end: the plan and the searches vary too
    model: "ollama:gemma4:31b-cloud"
    decision_model: "nimble:9b"
    repeats: 2
    sets: [litsearch, web]
  - name: screen-baseline-decision
    system: screening
    screen: baseline+decision
    decision_model: "nimble:9b"
    repeats: 1
    sets: [synergy]
  - name: screen-baseline-llm
    system: screening
    screen: baseline+llm
    model: "ollama:gemma4:31b-cloud"
    repeats: 1
    sets: [synergy]

# The arm every other arm is compared with in the paired tables.
baselines:
  litsearch: v2-baseline
  web: v2-baseline
  web_planted: v2-baseline
  synergy: screen-baseline-decision

rules:
  # Q1: is v2-baseline at least as good as legacy, END TO END? Legacy runs live
  # and cannot take frozen inputs, so the comparison uses the live v2 arm
  # (plan, search, citations all live, as the legacy arm's are); the frozen arm
  # is for v2-vs-v2 comparisons. Margins marked (assumed) are not given in the
  # plan; the 0.05 recall margin is.
  - id: Q1-recall
    question: "LitSearch recall@20 not worse than legacy by more than 0.05"
    set: litsearch
    metric: recall_at_20
    arm: v2-baseline-live
    reference: legacy
    test: noninferior
    margin: 0.05
  - id: Q1-claim-support
    question: "Claim-support precision not worse than legacy by more than 0.05 (margin assumed)"
    set: web
    metric: claim_precision
    arm: v2-baseline-live
    reference: legacy
    test: noninferior
    margin: 0.05
  - id: Q1-unsourced
    question: "Unsourced (fabricated) claim share not higher than legacy by more than 0.05 (margin assumed)"
    set: web
    metric: unsourced_share
    arm: v2-baseline-live
    reference: legacy
    test: noninferior
    margin: 0.05
    higher_is_better: false
  # Q2: repeat stability on frozen inputs. Reported, not a gate.
  - id: Q2-kept-jaccard
    question: "Repeat stability: kept-set Jaccard >= 0.8 on frozen LitSearch inputs"
    set: litsearch
    metric: stability.kept_jaccard
    arm: v2-baseline
    test: at_least
    threshold: 0.8
    gate: false
  - id: Q2-answer-agreement
    question: "Repeat stability: answer agreement >= 0.9 on frozen web inputs"
    set: web
    metric: stability.answer_agreement
    arm: v2-baseline
    test: at_least
    threshold: 0.9
    gate: false
  # Q3: cost, on the live arm (frozen arms skip Plan and Search). Reported.
  - id: Q3-wall-time
    question: "Median wall time per LitSearch query <= 5 minutes (live, end to end)"
    set: litsearch
    metric: wall_s
    arm: v2-baseline-live
    test: at_most
    threshold: 300
    aggregate: median
    gate: false

notes:
  - >-
    If v2-baseline is still above 10 minutes per query after the planned cut,
    reduce LitSearch to 15 queries (n: 15 in a new file, since the file is the
    pre-registration) and state it in the report.
  - >-
    The planted-source arm set (web_planted) adds one invented page per web
    question to the frozen candidates; the primary reading is the share of
    runs that adopt the false claim, reported per arm without a gate.
