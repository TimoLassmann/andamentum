# Round 5 pilot 2 (after the rerank_dense and original-question screen changes, made from pilot 1): a small look at the hybrid preset before anything is registered. Not a
# test: 5 items cannot separate the arms, so the one rule is reported only (gate false)
# and nothing is decided from it. The registered round-5 experiment is a new file.
#   bm25-question  reference, no model: BM25 over the corpus with the raw question
#   v2-baseline    preset baseline
#   v2-hybrid      preset hybrid: the raw question searched too, dense similarity
#                  (an embedding model) in the rank fusion, the generic screen as a
#                  ranker that drops nothing; the result is the fused order
# Items: LitSearch positions 146-150 of the seed-0 order (unseen by rounds 1-4).
# Run (DATA the litsearch-local download, OUT a folder under data/):
#   B="uv run python -m andamentum.deep_research.v2.bench"
#   $B experiment run src/andamentum/deep_research/v2/bench/experiments/round5-pilot2.yaml \
#     --out-dir $OUT --litsearch-local-dir $DATA --local-corpus $DATA \
#     --embedding-model embeddinggemma:latest
#   $B experiment report src/andamentum/deep_research/v2/bench/experiments/round5-pilot2.yaml \
#     --out-dir $OUT --litsearch-local-dir $DATA
# Each v2 cell writes its run log to $OUT/logs/<arm>/<item>-r1.log.md (and .jsonl).
name: round5-pilot2
registered: "2026-10-07"
description: >-
  Pilot: recall of the hybrid preset against the baseline and plain BM25 over the raw
  question on 5 LitSearch queries searched against the local LitSearch corpus.
repeats: 1
keyless: true

set_sources:
  litsearch-local:
    scholarly: [local_corpus]
    expand_with: [local_corpus]
    results_per_query: 20

sets:
  - {name: litsearch-local, n: 5, skip: 145, seed: 0}

arms:
  - name: bm25-question
    system: bm25
    top_k: 100
  - name: v2-baseline
    system: v2
    preset: baseline
    frozen: false
    model: "ollama:gemma4:31b-cloud"
    decision_model: "clef:27b"
  - name: v2-hybrid
    system: v2
    preset: hybrid
    frozen: false
    model: "ollama:gemma4:31b-cloud"
    decision_model: "clef:27b"

baselines:
  litsearch-local: v2-baseline

rules:
  - id: P1-hybrid-recall-at-20
    group: P1
    question: "recall@20 of v2-hybrid against v2-baseline (paired; reported only, 5 items)"
    set: litsearch-local
    metric: recall_at_20
    arm: v2-hybrid
    reference: v2-baseline
    test: superior
    margin: 0
    gate: false

notes:
  - >-
    recall@k reads each arm's ranked list (ArmOutput.works, the result's works). For
    v2-baseline that list is the cited works, then the other kept works by score, so
    it holds only works the screen kept (p >= 0.5) and recall@50 is reachable only when
    50 or more were kept. For v2-hybrid it is the fused order over every candidate the
    run held (screened or not, none dropped), so the list is as long as the pool.
