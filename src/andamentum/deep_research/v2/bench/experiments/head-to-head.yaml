# Head to head: the legacy pipeline (v1) against v2 with its default preset (hybrid),
# each run as a user runs it. Decides whether v2 replaces v1. Rules, margins and wording
# were fixed before any run; a change is a new file.
#   legacy     run_research: web search through SearxNG, its own defaults
#   v2-hybrid  research(): web mode for SimpleQA, scholarly mode (OpenAlex, Europe PMC,
#              arXiv) for LitSearch, preset hybrid, decision model clef:27b
# Sets:
#   simpleqa       60 SimpleQA questions (seed 1, positions 4-63; 1-3 were smoke runs),
#                  each answer graded correct / incorrect / not attempted against the gold
#                  answer by gpt-oss:120b-cloud, a model neither arm uses
#   litsearch-web  60 LitSearch queries (seed 0, positions 151-210: unseen by rounds
#                  1-5) searched live; a gold paper is matched by title
# The cells run item by item (legacy, then v2, on the same item), one at a time, so both
# arms meet the same state of the search services and every wall time is clean.
# Run (DATA the litsearch-local download, SQA the folder of simple_qa_test_set.csv,
# OUT a folder under data/):
#   B="uv run python -m andamentum.deep_research.v2.bench"
#   $B experiment run src/andamentum/deep_research/v2/bench/experiments/head-to-head.yaml \
#     --out-dir $OUT --litsearch-local-dir $DATA --simpleqa-dir $SQA \
#     --embedding-model embeddinggemma-2:latest
#   $B experiment report src/andamentum/deep_research/v2/bench/experiments/head-to-head.yaml \
#     --out-dir $OUT
# A search outage stops the run without recording the cell; the same command resumes.
name: head-to-head
registered: "2026-10-07"
description: >-
  v1 (legacy) against v2 (hybrid preset): SimpleQA answer correctness, LitSearch
  recall@20 searched live, and wall time per question, on the same items, cell by cell.
repeats: 1
grader: "ollama:gpt-oss:120b-cloud"

sets:
  - {name: simpleqa, n: 60, skip: 3, seed: 1}
  - {name: litsearch-web, n: 60, skip: 150, seed: 0}

arms:
  - name: legacy
    system: legacy
    model: "ollama:gemma4:31b-cloud"
  - name: v2-hybrid
    system: v2
    preset: hybrid
    frozen: false
    model: "ollama:gemma4:31b-cloud"
    decision_model: "clef:27b"

baselines:
  simpleqa: legacy
  litsearch-web: legacy

rules:
  - id: Q1-simpleqa-correct
    group: Q
    question: "SimpleQA correctness of v2-hybrid is not worse than legacy by more than 0.05 (paired)"
    set: simpleqa
    metric: correct
    arm: v2-hybrid
    reference: legacy
    test: noninferior
    margin: 0.05
  - id: Q2-litsearch-recall-at-20
    group: Q
    question: "LitSearch recall@20 of v2-hybrid is not worse than legacy by more than 0.05 (paired)"
    set: litsearch-web
    metric: recall_at_20
    arm: v2-hybrid
    reference: legacy
    test: noninferior
    margin: 0.05
  - id: S1-simpleqa-wall
    group: S
    question: "wall seconds per SimpleQA question of v2-hybrid are not above legacy's by more than 15 s (paired)"
    set: simpleqa
    metric: wall_s
    arm: v2-hybrid
    reference: legacy
    test: noninferior
    margin: 15
    higher_is_better: false
  - id: S2-litsearch-wall
    group: S
    question: "wall seconds per LitSearch query of v2-hybrid are not above legacy's by more than 15 s (paired)"
    set: litsearch-web
    metric: wall_s
    arm: v2-hybrid
    reference: legacy
    test: noninferior
    margin: 15
    higher_is_better: false
  - id: B1-simpleqa-better
    question: "SimpleQA correctness of v2-hybrid above legacy (paired; reported)"
    set: simpleqa
    metric: correct
    arm: v2-hybrid
    reference: legacy
    test: superior
    gate: false
  - id: B2-litsearch-better
    question: "LitSearch recall@20 of v2-hybrid above legacy (paired; reported)"
    set: litsearch-web
    metric: recall_at_20
    arm: v2-hybrid
    reference: legacy
    test: superior
    gate: false

decisions:
  - id: D1-replace
    requires: [Q, S]
    if_accepted: >-
      v2 replaces v1: it is not worse on either set and not slower; v1 is removed (no
      legacy code is kept) once epistemic is moved to v2.
    otherwise: >-
      v2 does not replace v1 as it stands: the groups not accepted say where it falls
      short (Q: results, S: speed).

notes:
  - >-
    Each system runs as a user runs it: v1 searches the web only (it has no scholarly
    sources), v2 searches the web for SimpleQA and the scholarly sources for LitSearch.
    So the LitSearch rule compares the two tools, not the two engines on the same
    sources.
  - >-
    The legacy pipeline counts no tokens or model calls, so cost is compared by wall
    time only.
  - >-
    Keyless is false: an OpenAlex key in the environment is used. Without one, OpenAlex
    allows about 100 keyword searches a day; a refused search stops the run (not
    recorded), and the same command resumes.
