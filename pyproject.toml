[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "andamentum"
version = "0.3.0"
description = "Composable agentic systems for scientific automation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Timo Lassmann" },
]
keywords = [
    "agents",
    "llm",
    "epistemology",
    "deep-research",
    "knowledge-base",
    "manuscript-review",
    "scientific-computing",
    "rag",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
# Dependency constraints carry both a lower bound (oldest version we've
# tested against) AND an upper bound capping the next major version so
# a downstream resolver can't silently pull in a new major that breaks
# the API. Upgrade the upper bound deliberately when bumping a major.
dependencies = [
    "pydantic>=2.0.0,<3",            # epistemic, deep-research, document-store
    "aiosqlite>=0.19.0,<1",          # document-store
    "sqlite-vec>=0.1.6,<0.2",        # pre-1.0 ABI: pin minor too
    "numpy>=1.24.0,<3",              # document-store
    "scipy>=1.10.0,<2",              # document-store
    "rank-bm25>=0.2.2,<1",           # document-store, epistemic[search]
    "httpx>=0.28.1,<1",              # deep-research, document-store
    # harvest (PDF / DOCX / PPTX / HTML fallback). The floor is 2.121.0 and it
    # is load-bearing, not just "the version we tested": the `vlm` extra below
    # pulls mlx-vlm, and mlx-vlm 0.6.16+ requires transformers>=5.14 while
    # docling 2.97+ requires transformers<5.9. Without a docling floor the
    # resolver settles that clash by silently DOWNGRADING docling to 2.96.1.
    # This floor makes the incompatible mlx-vlm versions unsatisfiable instead,
    # so the resolver picks mlx-vlm 0.6.4 and docling stays current.
    "docling>=2.121.0,<3",
    # docling's own PDF backend. harvest.pdf_probe uses it directly to ask
    # whether a PDF has a text layer without importing docling (and torch).
    # Declared because we import it, not merely inherit it.
    "pypdfium2>=5.10,<6",            # harvest text-layer probe
    # torch/torchvision are docling's (transitive) ML backend. Declared here
    # only so the CPU-index pin in [tool.uv.sources] binds — uv applies sources
    # to declared deps, not transitive ones. Ranges stay open; docling narrows.
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "scikit-learn>=1.3,<2",          # epistemic
    # v2 unbundled the bedrock provider; core.models imports it, hence the extra.
    "pydantic-ai[bedrock]>=2.22,<3",  # whetstone / epistemic / deep-research
    "pydantic-graph>=2.22,<3",       # graph state machines (whetstone, deep-research)
    "mcp>=1.27,<2",                  # compose: the stdio MCP server (already in the lock via pydantic-ai)
    "python-dotenv>=1.0.0,<2",       # epistemic / deep-research demos
    "rich>=13.0.0,<16",              # epistemic / whetstone CLI rendering
    "markdown>=3.5.0,<4",            # typeset
    "python-docx>=1.2.0,<2",         # whetstone docx track-changes
    "lxml>=5.0.0,<7",                # whetstone docx XML manipulation
    "matplotlib>=3.8,<4",            # figures
    "rapidfuzz>=3.0,<4",             # chunker fuzzy anchor matching
    "textstat>=0.7.4,<1",            # proofread deterministic readability
    "python-pptx>=1.0,<2",           # proofread --slides (already in the lock via docling)
    "pyyaml>=6,<7",                  # bundle frontmatter, compose genre files (already in the lock)
]

[project.urls]
Homepage      = "https://github.com/TimoLassmann/andamentum"
Repository    = "https://github.com/TimoLassmann/andamentum"
Documentation = "https://github.com/TimoLassmann/andamentum/tree/main/docs"
Changelog     = "https://github.com/TimoLassmann/andamentum/blob/main/CHANGELOG.md"
Issues        = "https://github.com/TimoLassmann/andamentum/issues"

[project.scripts]
andamentum-epistemic    = "andamentum.epistemic.cli:main"
andamentum-research     = "andamentum.deep_research.cli:main"
andamentum-whetstone    = "andamentum.whetstone.cli:main"
andamentum-compose      = "andamentum.compose.cli:main"
andamentum-figures      = "andamentum.figures.cli:main"
andamentum-chunker      = "andamentum.chunker.cli:main"
andamentum-harvest      = "andamentum.harvest.cli:main"
andamentum-typeset      = "andamentum.typeset.cli:main"
andamentum-vision-critique = "andamentum.vision_critique.cli:main"
andamentum-proofread    = "andamentum.proofread.cli:main"
andamentum-agentic-dialect      = "andamentum.agentic_dialect.cli:main"
andamentum-forge        = "andamentum.forge.cli:main"
andamentum-llm-judge    = "andamentum.llm_judge.cli:main"
andamentum-docstore     = "andamentum.document_store.cli:main"

[project.optional-dependencies]
# trafilatura (Apache-2.0, MIT-compatible) is kept out of the default
# install to keep the dependency surface small, not for licensing reasons:
# the harvest backend falls back to docling automatically when trafilatura
# is not installed. Install `andamentum[html-articles]` for best-in-class
# HTML article extraction.
html-articles = [
    "trafilatura>=2.0.0,<3",
]
# PDF rendering in andamentum.typeset (render_pdf, the typeset CLI's .pdf
# output) needs WeasyPrint (BSD-3-Clause, MIT-compatible). It also requires
# system libraries (pango, cairo) — see the render_pdf error message. Kept
# optional because most rendering targets HTML/.docx and WeasyPrint's native
# deps are heavy. Install `andamentum[pdf]` to enable it.
pdf = [
    "weasyprint>=60,<67",
]
# `andamentum.harvest` mode="accurate": docling's VLM pipeline. One model
# (granite-docling-258M) replaces the layout + OCR + TableFormer stack and
# emits DocTags, and SmolVLM-256M writes a description for every figure.
# Kept optional because the model weights run to several hundred MB and
# mode="fast" needs none of it; harvest raises a clear ImportError naming
# this extra when mode="accurate" is asked for without it.
#
# mlx-vlm is Apple-silicon only, and there it is load-bearing rather than a
# nicety: docling's own benchmark puts SmolDocling at 6.2 s/page under MLX
# against 102 s/page under Transformers on an M3 Max. Elsewhere docling's
# AUTO_INLINE engine selects Transformers, which the `transformers` pin
# below covers. Pinned to the minor (pre-1.0 API).
vlm = [
    "docling[vlm]>=2.54.0,<3",
    "transformers>=4.45,<6",
    # Lower bound deliberately LOW. mlx-vlm 0.6.16+ requires transformers>=5.14,
    # which docling 2.97+ forbids (it needs <5.9), so a high floor here forces
    # docling down to 2.96.1. Leaving room for 0.6.4 lets the resolver satisfy
    # both and keep docling current. Raise this only together with a check that
    # docling still resolves to its own floor above.
    "mlx-vlm>=0.6.4,<0.7; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# Cross-encoder reranking in andamentum.document_store.rerank. sentence-
# transformers (Apache-2.0) pulls a transformers runtime; torch is already a
# core dep (docling's backend), so the marginal install is the
# sentence-transformers wheel plus a one-time model download cached by the
# HuggingFace hub. Kept optional because `search()` never calls the reranker
# and a caller that does not rerank must not pay a 0.6B model's import,
# load time, or resident memory.
rerank = [
    "sentence-transformers>=5.0,<7",
]
dev = [
    "pytest>=8.0.0,<9",
    "pytest-asyncio>=0.24.0,<1",
    "pyright>=1.1.0,<2",
    "ruff>=0.1.0,<1",
    "fastapi>=0.109,<1",
    "uvicorn>=0.27,<1",
    "trafilatura>=2.0.0,<3",   # dev install gets every backend for full-suite tests
    # Same reason: the dev install type-checks and exercises the rerank path.
    # It adds no transitive dependency — torch and transformers are already here.
    "sentence-transformers>=5.0,<7",
]
# The SciFact calibration benchmark (paper/scifact/) is orchestrated by
# Snakemake; everything else it needs (scipy, matplotlib, numpy, pyyaml, rich,
# python-dotenv, pydantic-ai) is already a core dependency. Install
# `andamentum[benchmark]` and run it from this single venv — no separate env.
benchmark = [
    "snakemake>=8.0.0,<10",
]

[tool.uv]
# Supply-chain cooldown: at resolve time (uv lock / add / upgrade) ignore
# any package version uploaded in the last 7 days. Rolling window —
# re-evaluated on every resolve. Does NOT affect `uv sync` from the
# existing lockfile.
#
# Why: blocks freshly-published malicious releases (typosquats,
# hijacked maintainers, stolen publish tokens) from being pulled into
# the dependency tree before the community has time to flag them. If
# bleeding-edge versions aren't required, the lag costs nothing.
#
# Active enforcement: the `uv.lock` next to this file is the actual
# pin (with hashes); the >= ranges above are resolver inputs only.
# CI / containers / agents should run `uv sync --locked` (or set
# `UV_LOCKED=1`) so the lockfile cannot drift silently.
exclude-newer = "7 days"

# CPU-only PyTorch. docling (a core dep) pulls torch/torchvision for its
# layout + table models, and the default PyPI torch *Linux* wheel hard-declares
# the full NVIDIA CUDA runtime (nvidia-cublas, cudnn, nccl, cusparse, …) —
# multiple GB downloaded even on GPU-less machines (CI, containers), and the
# download stalls on the ~400 MB CUDA wheels. docling only needs CPU inference,
# so resolve torch from PyTorch's CPU index instead.
#
# This drops the entire nvidia-* stack on Linux/Windows; macOS is unaffected in
# substance (its wheels are CPU/MPS-only either way — MPS/Metal still works).
# A consumer who genuinely wants CUDA torch overrides the source downstream.
# torch/torchvision must be listed in [project.dependencies] above for this to
# bind: uv applies sources to declared deps, not purely transitive ones.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/andamentum"]
# Tests + their fixtures are not part of the importable runtime surface;
# keep them out of the installed wheel (they still ship in the sdist).
exclude = [
    "**/tests",
    "**/tests/**",
    "**/conftest.py",
    # Agent notes (per-module CLAUDE.md) are not runtime code.
    "**/CLAUDE.md",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/andamentum",
    "docs",
    "examples",
    "README.md",
    "LICENSE",
    "RESPONSIBLE_USE.md",
    "CHANGELOG.md",
    "pyproject.toml",
]
exclude = [
    # Internal plans / freezes / working notes — not for the public tarball.
    "docs/.internal/**",
]

[tool.ruff]
# Research scripts under experiments/ are not library code; they are
# neither linted nor formatted, so CI checks what ships.
extend-exclude = ["experiments"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["src/andamentum"]
asyncio_mode = "auto"
# Gated markers: tests tagged with these are NOT run by default.
# Invoke explicitly: `uv run pytest -m benchmark`, `uv run pytest -m ollama`,
# or `uv run pytest -m cloud`.
markers = [
    "ollama: test requires a live Ollama embedding backend",
    "benchmark: long-running accuracy or performance benchmark",
    "cloud: test calls a real cloud LLM (costs tokens, needs API key)",
    "live_provider: test calls a live evidence provider API (PubMed, OpenAlex, etc.) — needs internet, no auth typically required",
    "vlm: harvest test that imports docling (~1 GB of torch) and/or runs a local vision-language model for mode='accurate'. Deselected so the default suite stays runnable while other models hold the machine's memory",
    "rerank: document_store test that downloads and runs a real cross-encoder (~2 GB of weights, needs the `rerank` extra). Deselected for the same reason as `vlm`; every other rerank test stubs the model",
    "compose_eval: compose test that calls real models (costs tokens or local compute). Deselected like `cloud`; run with `uv run pytest -m compose_eval`",
]
# Exclude gated tests from default runs. Explicitly selecting a marker
# overrides this.
addopts = "-m 'not ollama and not benchmark and not cloud and not live_provider and not vlm and not rerank and not compose_eval'"
